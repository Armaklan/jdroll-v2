version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: jdroll-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jdroll
      MYSQL_USER: jdroll
      MYSQL_PASSWORD: jdroll
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/create.sql:/docker-entrypoint-initdb.d/01-create.sql:ro
      - ./data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  jd-backend:
    container_name: jdroll-backend
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      HOST: "0.0.0.0"
      NODE_ENV: production
      JWT_SECRET: jdroll-production-secret-key-change-in-production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: jdroll
      DB_PASSWORD: jdroll
      DB_NAME: jdroll
      FILES_DIR: /app/files
    volumes:
      - uploads_data:/app/files
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"

  jd-frontend:
    container_name: jdroll-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - jd-backend
    expose:
      - "80"

  jd-nginx-v2:
    container_name: jdroll-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  uploads_data:
