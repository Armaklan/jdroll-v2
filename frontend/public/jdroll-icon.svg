<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="d20Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefefe"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>

  <!-- Épées croisées en arrière-plan -->
  <g opacity="0.9">
    <!-- Épée 1 (diagonale) -->
    <path d="M 30 30 L 170 170" stroke="url(#swordGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 170 170 L 150 150 M 170 170 L 190 190" stroke="url(#swordGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Épée 2 (anti-diagonale) -->
    <path d="M 170 30 L 30 170" stroke="url(#swordGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 30 170 L 50 150 M 30 170 L 10 190" stroke="url(#swordGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Garde des épées -->
    <rect x="85" y="85" width="30" height="30" fill="url(#swordGrad)" opacity="0.7" rx="5"/>
  </g>

  <!-- D20 -->
  <circle cx="100" cy="100" r="45" fill="url(#d20Grad)" stroke="#4f46e5" stroke-width="3"/>
  
  <!-- Faces visibles du d20 -->
  <text x="100" y="95" font-size="20" font-weight="bold" fill="white" text-anchor="middle">20</text>
  <text x="80" y="110" font-size="12" fill="white">1</text>
  <text x="120" y="110" font-size="12" fill="white">20</text>
  
  <!-- Texte jdRoll en bas -->
  <text x="100" y="165" font-size="24" font-weight="bold" font-family="Arial, sans-serif" 
        fill="url(#textGrad)" text-anchor="middle">jdRoll</text>
</svg>
