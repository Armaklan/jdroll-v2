services:
  db:
    image: mysql:8.0
    container_name: jdroll-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jdroll
      MYSQL_USER: jdroll
      MYSQL_PASSWORD: jdroll
    ports:
      - "3306:3306"
    volumes:
      - ./data/create.sql:/docker-entrypoint-initdb.d/01-create.sql:ro
      - ./data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

  jd-mailpit:
    image: axllent/mailpit:latest
    container_name: jdroll-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Interface web
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # Correcteur grammatical (LanguageTool) pour le backend en local (npm run dev:backend)
  # Le backend le contacte via LANGUAGETOOL_URL (défaut : http://localhost:8010)
  jd-languagetool:
    image: erikvl87/languagetool:latest
    container_name: jdroll-languagetool
    restart: unless-stopped
    environment:
      Java_Xms: "256m"
      Java_Xmx: "1g"
      # Préchauffe les pipelines à démarrage (évite la latence du premier appel)
      langtool_pipelinePrewarming: "true"
    ports:
      - "8010:8010"
    mem_limit: 1300m

  jd-phpmyadmin:
    image: phpmyadmin:latest
    container_name: jd-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

